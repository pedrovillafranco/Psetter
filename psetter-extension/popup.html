<html lang="en">

  </head>

    <main class="popup">

          </div>
          <div class="brand-copy">
            <h1>Psetter&trade;</h1>
            <p>by Pedro Villafranco</p>
          </div>
          <span id="buildBadge" class="build-badge" hidden>DEV</span>
        </a>
        <div class="header-toggle">
          <span id="enabledLabel">Off</span>
          <label class="switch-control" aria-label="Enable Psetter on MITx">
            <input id="enabled" type="checkbox" />
            <span aria-hidden="true"></span>
          </label>
        </div>
      </header>

      <section id="remoteNotice" class="remote-notice" aria-live="polite" hidden>
        <strong id="remoteNoticeTitle"></strong>
        <p id="remoteNoticeMessage"></p>
      </section>

      <section id="developerMessageNotice" class="developer-message-notice" aria-live="polite" hidden>
        <div class="developer-message-notice-copy">
          <span class="developer-message-eyebrow">New from Psetter</span>
          <strong id="developerMessageTeaser"></strong>
        </div>
        <button id="developerMessageOpen" class="developer-message-open" type="button">Read</button>
      </section>

      <section id="developerMessagePanel" class="developer-message-panel" role="dialog" aria-labelledby="developerMessageTitle" hidden>
        <header class="developer-message-header">
          <img class="developer-message-header-logo" src="icons/psetter-px-logo-white.svg" alt="P^x" />
          <strong class="developer-message-header-label">Notification</strong>
          <button id="developerMessageClose" class="developer-message-close" type="button" aria-label="Dismiss developer message">×</button>
        </header>
        <h2 id="developerMessageTitle"></h2>
        <p id="developerMessageText"></p>
        <p id="developerMessageSignature" class="developer-message-signature" hidden></p>
      </section>

      <section class="impact" aria-label="All-time impact">
        <div class="impact-range" role="group" aria-label="Usage range">
          <button class="impact-range-option is-selected" type="button" aria-pressed="true" data-range="all">All-Time</button>
          <button class="impact-range-option" type="button" aria-pressed="false" data-range="month">Month</button>
          <button class="impact-range-option" type="button" aria-pressed="false" data-range="week">Week</button>
          <button class="impact-range-option" type="button" aria-pressed="false" data-range="day">Day</button>
        </div>
        <div class="impact-grid" aria-live="polite">
          <div class="impact-stat">
            <strong id="operationsCount">0</strong>
            <span>Operations streamlined</span>
          </div>
          <div class="impact-stat">
            <strong id="timeSaved">0.0 seconds</strong>
            <span>Estimated time saved</span>
          </div>
        </div>
      </section>

      <details class="settings">
        <summary>Settings</summary>
        <!-- PSETTER_DEV_START -->
        <div class="developer-settings" data-developer-settings>
          <p class="settings-subheading">Developer</p>
          <label class="switch-row compact">
            <span>
              <strong>Show QA Tools</strong>
            </span>
            <span class="switch-control" aria-label="Show QA tools">
              <input id="devMode" type="checkbox" />
              <span aria-hidden="true"></span>
            </span>
          </label>
          <div id="devPanel" class="settings-panel" hidden>
            <div class="settings-actions">
              <button id="startCapture" type="button">Start Capture</button>
              <button id="stopCapture" type="button">Stop Capture</button>
              <button id="runScriptedQa" type="button">Run Scripted QA</button>
              <button id="exportQaLog" type="button">Export Log</button>
            </div>
            <p id="devStatus" class="dev-status" aria-live="polite"></p>
          </div>
        </div>
        <!-- PSETTER_DEV_END -->
        <p class="settings-subheading">Usage</p>
        <button id="resetUsage" class="reset-usage" type="button">
          Reset usage stats
        </button>
        <p class="settings-subheading">Demo</p>
        <button id="openDemo" class="settings-action" type="button">
          Try Psetter locally
        </button>
      </details>

      <footer>
        <span class="footer-identity">
          <span>&copy; 2026 <a class="creator-link" href="https://villafran.co" target="_blank" rel="noopener noreferrer">Pedro Villafranco</a></span>
          <span class="footer-version-separator" aria-hidden="true">·</span>
          <span id="extensionVersion" class="extension-version">v0.1.2</span>
        </span>
        <nav class="footer-links" aria-label="Footer links">
          <a href="https://psetter.villafran.co/privacy" target="_blank" rel="noopener">Privacy</a>
          <button id="feedbackLink" type="button">Feedback</button>
        </nav>
      </footer>
    </main>
    <script src="runtime-config.js"></script>
    <script src="remote-config.js"></script>
    <script src="popup.js"></script>
    <!-- PSETTER_DEV_SCRIPT_START -->
    <script src="popup-dev.js"></script>
    <!-- PSETTER_DEV_SCRIPT_END -->
  </body>
</html>
